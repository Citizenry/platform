services:
  mysql:
    image: mariadb:10.11
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: streetsignal
      MARIADB_USER: streetsignal
      MARIADB_PASSWORD: streetsignal
      LANG: C.UTF_8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_520_ci
    ports:
      - "33061:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7.2-alpine
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Migration service - runs once to set up database
  migration:
    build: .
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      APP_KEY: SomeRandomKey!!!SomeRandomKey!!!
      DOCKERIZE_TIMEOUT: 180s
      DOCKERIZE_WAIT_FOR_mysql: tcp://mysql:3306
      DOCKERIZE_WAIT_FOR_redis: tcp://redis:6379
      ENABLE_NGINX: "false"
      ENABLE_PHPFPM: "false"
      ENABLE_PLATFORM_TASKS: "false"
      RUN_PLATFORM_MIGRATIONS: "true"
      DB_MIGRATIONS_HANDLED: "true"
      DB_CONNECTION: mysql
      DB_DATABASE: streetsignal
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: streetsignal
      DB_PASSWORD: streetsignal
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
    command: >
      sh -c "
        echo 'Running database migrations...' &&
        php artisan phinx:migrate &&
        echo 'Seeding database...' &&
        php artisan db:seed --force &&
        echo 'Database setup complete!'
      "

  platform:
    build: .
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      APP_KEY: SomeRandomKey!!!SomeRandomKey!!!
      DOCKERIZE_TIMEOUT: 180s
      DOCKERIZE_WAIT_FOR_mysql: tcp://mysql:3306
      DOCKERIZE_WAIT_FOR_redis: tcp://redis:6379
      ENABLE_NGINX: "true"
      ENABLE_PHPFPM: "true"
      ENABLE_PLATFORM_TASKS: "false"
      RUN_PLATFORM_MIGRATIONS: "false"
      DB_MIGRATIONS_HANDLED: "true"
      DB_CONNECTION: mysql
      DB_DATABASE: streetsignal
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: streetsignal
      DB_PASSWORD: streetsignal
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      OAUTH_CLIENT_ID: streetsignalui
      OAUTH_CLIENT_SECRET: 138a6df73e70a5be36ebc2be60d4473d2b057182
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    ports:
      - "8081:8080"
    volumes:
      - storage-app-public:/var/www/storage/app/public
      - .:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v3/config"]
      interval: 30s
      timeout: 10s
      retries: 3

  platform_tasks:
    build: .
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      APP_KEY: SomeRandomKey!!!SomeRandomKey!!!
      DOCKERIZE_TIMEOUT: 180s
      DOCKERIZE_WAIT_FOR_mysql: tcp://mysql:3306
      DOCKERIZE_WAIT_FOR_redis: tcp://redis:6379
      ENABLE_NGINX: "false"
      ENABLE_PHPFPM: "false"
      ENABLE_PLATFORM_TASKS: "true"
      ENABLE_QUEUE_LISTEN: "true"
      TASK_RUN_PERIOD_SECS: "30"
      RUN_PLATFORM_MIGRATIONS: "false"
      DB_MIGRATIONS_HANDLED: "true"
      DB_CONNECTION: mysql
      DB_DATABASE: streetsignal
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: streetsignal
      DB_PASSWORD: streetsignal
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
    volumes:
      - storage-app-public:/var/www/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    networks:
      - internal

  # Frontend web client
  frontend:
    build:
      context: /home/jascha/Documents/Citizenry/platform-client-mzima
      dockerfile: Dockerfile
      args:
        - build_target=web:devbuild
        - HTTP_PORT=8080
    environment:
      HTTP_PORT: 8080
      API_URL: http://localhost:8081
      BACKEND_URL: http://localhost:8081
      OAUTH_CLIENT_ID: streetsignalui
      OAUTH_CLIENT_SECRET: 138a6df73e70a5be36ebc2be60d4473d2b057182
    ports:
      - "3000:8080"
    depends_on:
      platform:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  # share storage/app/public between platform containers
  storage-app-public:
  # persist mysql data
  mysql_data:

networks:
  internal:
    driver: bridge
