services:
  mysql:
    image: mariadb:10.11
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: streetsignal
      MARIADB_USER: streetsignal
      MARIADB_PASSWORD: streetsignal
      LANG: C.UTF_8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_520_ci
      # mysql 8.0
      # - --default-authentication-plugin=mysql_native_password
    ports:
      - "33061:3306"
    networks:
      - internal
  redis:
    image: redis:7.2-alpine
    dns:
      - 1.1.1.1
      - 8.8.8.8
    networks:
      - internal
  platform:
    build: .
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      APP_KEY: SomeRandomKey!!!SomeRandomKey!!!
      DOCKERIZE_TIMEOUT: 180s
      DOCKERIZE_WAIT_FOR_mysql: tcp://mysql:3306
      DOCKERIZE_WAIT_FOR_redis: tcp://redis:6379
      ENABLE_NGINX: "true"
      ENABLE_PHPFPM: "true"
      ENABLE_PLATFORM_TASKS: "false"
      RUN_PLATFORM_MIGRATIONS: "false"
      DB_MIGRATIONS_HANDLED: "false"
      DB_CONNECTION: mysql
      DB_DATABASE: streetsignal
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: streetsignal
      DB_PASSWORD: streetsignal
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    ports:
      - "8081:8080"
    volumes:
      - storage-app-public:/var/www/storage/app/public
      - .:/var/www
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
  platform_tasks:
    build: .
    dns:
      - 1.1.1.1
      - 8.8.8.8
    environment:
      APP_KEY: SomeRandomKey!!!SomeRandomKey!!!
      DOCKERIZE_TIMEOUT: 180s
      DOCKERIZE_WAIT_FOR_mysql: tcp://mysql:3306
      DOCKERIZE_WAIT_FOR_redis: tcp://redis:6379
      ENABLE_NGINX: "false"
      ENABLE_PHPFPM: "false"
      ENABLE_PLATFORM_TASKS: "true"
      ENABLE_QUEUE_LISTEN: "true"
      TASK_RUN_PERIOD_SECS: "30"
      RUN_PLATFORM_MIGRATIONS: "false"
      DB_MIGRATIONS_HANDLED: "false"
      DB_CONNECTION: mysql
      DB_DATABASE: streetsignal
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: streetsignal
      DB_PASSWORD: streetsignal
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      QUEUE_DRIVER: redis
    volumes:
      - storage-app-public:/var/www/storage/app/public
    networks:
      - internal

volumes:
  # share storage/app/public between platform containers
  storage-app-public:

networks:
  internal:
    driver: bridge
